<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1f27;
    --muted: #5b6472;
    --border: #c9ced6;
    --accent: #2f5bea;
    --accent-hover: #2349c4;
    --accent-text: #ffffff;
    --focus: #2f5bea;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a;
      --card: #1b1f27;
      --text: #eef0f4;
      --muted: #9aa3b2;
      --border: #3a4150;
      --accent: #6c8cff;
      --accent-hover: #86a0ff;
      --accent-text: #0e1220;
      --focus: #86a0ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }

  .card {
    width: 100%;
    max-width: 400px;
    padding: 32px 28px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    line-height: 1.25;
  }

  .sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.9rem;
    font-weight: 600;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input::placeholder { color: var(--muted); opacity: 0.8; }

  input:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent);
  }

  .btn {
    display: block;
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s;
  }

  .btn:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--focus) 45%, transparent);
    outline-offset: 2px;
  }

  .btn-primary {
    color: var(--accent-text);
    background: var(--accent);
    border: 1px solid var(--accent);
  }

  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .btn-secondary {
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .forgot {
    display: block;
    margin: -6px 0 20px;
    text-align: right;
    font-size: 0.875rem;
    color: var(--accent);
  }

  @media (max-width: 420px) {
    .card { padding: 24px 18px; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="sub">Welcome back. Enter your details to continue.</p>

    <form action="/signin" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>

      <a class="forgot" href="/forgot-password">Forgot password?</a>

      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <div class="divider" role="separator"><span>or</span></div>

    <a class="btn btn-secondary" href="/signup">Create an account</a>
  </main>
</body>
</html>
